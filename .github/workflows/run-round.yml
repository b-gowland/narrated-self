name: Run a round

# A manual "run" button for a round, so a round can run from GitHub without the
# maintainer's PC (added 28 Nov 2026). It never runs on a schedule. It sends the
# prompts, masks the outputs, runs the pre-registered measures, then opens a
# pull request with the results for the maintainer to review. Nothing reaches
# the live site until that pull request is merged and the site is rebuilt.
#
# Start it by hand: Actions -> Run a round -> Run workflow, and give the round
# (for example R1). It needs config/models_<round>.yaml on main. To finish a
# round that stopped part way, also give the branch its pull request came from
# (round/R1-...): the outputs already there are kept and only the missing
# cells are sent.
#
# How it is built (changed 28 Nov 2026, after the first R1 run sent its prompts
# one model after another, ran past the two-hour limit and lost every output):
# - Each model runs in its own job, side by side, so a slow model can't hold up
#   the others.
# - Each model's outputs are saved as an artifact as soon as its job ends, even
#   if it failed or ran out of time. The last job always gathers whatever was
#   saved and opens the pull request, so a partial round is never lost.
# - Progress prints one line per call, so the log shows how far it has got.
#
# The OpenRouter key is OPENROUTER_API_KEY, a secret of the "production"
# environment, which only main can use. It is a separate key ("GitHub round
# runner") with its own limit in OpenRouter; that limit is the real cap on
# spend. The key is handed only to the step that calls the models.
#
# Raw outputs are append-only (CLAUDE.md rule 3): the runner only adds lines,
# and the last job checks that no existing raw file lost or changed a line.

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Round to run, for example R1 (needs config/models_<round>.yaml)"
        required: true
      resume_from:
        description: "Optional: a round/... branch whose outputs to keep (to finish a part-done round)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: run-round
  cancel-in-progress: false

env:
  ROUND: ${{ inputs.round }}
  RESUME_FROM: ${{ inputs.resume_from }}
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      providers: ${{ steps.list.outputs.providers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Check the inputs and the round's model config
        run: |
          if ! [[ "$ROUND" =~ ^R[0-9]+$ ]]; then
            echo "::error::Round must look like R1, R2 and so on; got '$ROUND'."; exit 1
          fi
          if [ ! -f "config/models_${ROUND}.yaml" ]; then
            echo "::error::config/models_${ROUND}.yaml is not on main."; exit 1
          fi
          if [ -n "$RESUME_FROM" ] && ! [[ "$RESUME_FROM" =~ ^round/${ROUND}-[0-9-]+$ ]]; then
            echo "::error::resume_from must be a round/${ROUND}-... branch; got '$RESUME_FROM'."; exit 1
          fi

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --locked
      - run: uv run pytest -q

      - name: Protocol unchanged since prereg-v1
        run: |
          git fetch --tags --force
          git diff --exit-code --stat prereg-v1 -- protocol/ \
            || { echo "::error::protocol/ differs from prereg-v1."; exit 1; }

      - name: Dry run (prompt count and cost estimate; no API calls)
        run: uv run tns run --round "$ROUND" --dry-run | tail -15

      - name: List the models to run
        id: list
        run: |
          providers=$(uv run python -c "import json,yaml; print(json.dumps([m['provider'] for m in yaml.safe_load(open('config/models_${ROUND}.yaml'))['models']]))")
          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "Models: $providers"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment: production
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --locked

      - name: Keep outputs from an earlier, part-done run
        if: inputs.resume_from != ''
        run: |
          git fetch --depth=1 origin "$RESUME_FROM"
          git checkout FETCH_HEAD -- "data/raw/$ROUND/" 2>/dev/null || echo "No $ROUND outputs on $RESUME_FROM."
          f="data/raw/$ROUND/${{ matrix.provider }}.jsonl"
          echo "Already done for ${{ matrix.provider }}: $( [ -f "$f" ] && wc -l < "$f" || echo 0 ) outputs"

      - name: Send the prompts (${{ matrix.provider }})
        timeout-minutes: 180
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY to the production environment first."; exit 1
          fi
          uv run tns run --round "$ROUND" --only "${{ matrix.provider }}"

      - name: Save this model's outputs, even after a failure or timeout
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: raw-${{ matrix.provider }}
          path: data/raw/${{ inputs.round }}/${{ matrix.provider }}.jsonl
          if-no-files-found: warn
          retention-days: 30

  collect:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --locked

      - name: Start from the outputs of the earlier, part-done run
        if: inputs.resume_from != ''
        run: |
          git fetch --depth=1 origin "$RESUME_FROM"
          git checkout FETCH_HEAD -- "data/raw/$ROUND/" 2>/dev/null || echo "No $ROUND outputs on $RESUME_FROM."
          git reset -q  # unstage; the files stay in place and the new artifacts overwrite them

      - name: Gather every model's outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: raw-*
          path: data/raw/${{ inputs.round }}
          merge-multiple: true

      - name: Count outputs per model
        id: count
        run: |
          total=0; summary=""
          for f in data/raw/"$ROUND"/*.jsonl; do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f"); total=$((total + n))
            summary="$summary $(basename "$f" .jsonl): $n;"
          done
          echo "Outputs:$summary total $total"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          if [ "$total" -eq 0 ]; then echo "::error::No outputs were saved."; exit 1; fi

      - name: Raw data only gained lines
        run: |
          # Every raw file already on main, and on the resumed branch, must still start with exactly its old contents.
          python3 - <<'EOF'
          import os, subprocess, sys
          refs = ["HEAD"]
          if os.environ.get("RESUME_FROM"):
              subprocess.run(["git", "fetch", "--depth=1", "origin", os.environ["RESUME_FROM"]], check=True)
              refs.append("FETCH_HEAD")
          checked = 0
          for ref in refs:
              files = subprocess.run(["git", "ls-tree", "-r", "--name-only", ref, "data/raw"],
                                     capture_output=True, text=True, check=True).stdout.split()
              for f in files:
                  old = subprocess.run(["git", "show", f"{ref}:{f}"], capture_output=True, check=True).stdout
                  if not os.path.exists(f) or not open(f, "rb").read().startswith(old):
                      print(f"::error::{f} changed instead of only growing."); sys.exit(1)
                  checked += 1
          print(f"{checked} existing raw files only grew.")
          EOF

      - name: Mask names and run the measures
        id: measures
        # A part-done round may be too thin for the measures; the outputs are still committed.
        continue-on-error: true
        run: |
          uv run tns mask --round "$ROUND"
          uv run tns analyse --round "$ROUND"

      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_RESULT: ${{ needs.run.result }}
          MEASURES_RESULT: ${{ steps.measures.outcome }}
        run: |
          branch="round/${ROUND}-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/raw data/derived site/findings
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "data: round $ROUND outputs, masking and measures"
          git push -u origin "$branch"
          status="All models finished."
          if [ "$RUN_RESULT" != "success" ]; then
            status="Not every model finished (run jobs: $RUN_RESULT). To send only the missing cells, run this workflow again with round $ROUND and resume_from $branch."
          fi
          if [ "$MEASURES_RESULT" != "success" ]; then
            status="$status The masking or measures step failed; see the run log. Raw outputs are committed."
          fi
          gh pr create --base main --head "$branch" \
            --title "Round $ROUND: outputs, masking and measures" \
            --body "Run by the 'Run a round' workflow (run ${{ github.run_id }}). Outputs per model:${{ steps.count.outputs.summary }} total ${{ steps.count.outputs.total }}.

          $status

          Before merging: read the run log for failed cells, check the masking log in data/derived/$ROUND/, run the QA script and write docs/rounds/$ROUND.md. The site data (tns site) is built after review."
