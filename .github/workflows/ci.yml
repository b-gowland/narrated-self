name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --locked
      - run: uv run pytest -q

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Worker logic tests
        working-directory: worker
        run: node --test test/*.test.js

  site-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser tests (phone and desktop)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - name: Keep the report if anything failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: No secrets or blinding keys committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|^data/keys/' || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Protocol frozen after prereg-v1
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/prereg-v1 >/dev/null; then
            git diff --exit-code --stat prereg-v1 -- protocol/ \
              || { echo "protocol/ differs from prereg-v1. Add a versioned file instead."; exit 1; }
          else
            echo "prereg-v1 is not tagged yet; protocol/ is still editable."
          fi
