name: Deploy site to Cloudflare Pages

# The site moved from GitHub Pages to Cloudflare Pages (project
# "narratedself") on 17 Nov 2026, during a GitHub account suspension. Deploys
# need CLOUDFLARE_API_TOKEN (only "Account · Cloudflare Pages · Edit") and
# CLOUDFLARE_ACCOUNT_ID as secrets of the "production" environment, limited
# to main. Until they exist the deploy job says so and publishes nothing.
# Only the publish step sees the token; Wrangler is pinned.

on:
  push:
    branches: [main]
    paths: ["site/**", "e2e/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  # The site only deploys if the browser tests pass.
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser tests (phone and desktop)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npx playwright test

  build:
    needs: site-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Check the site has no secrets or local paths
        run: |
          if grep -rEn 'sk-(ant|or|proj)-|AIza[0-9A-Za-z_-]{20}|xai-[A-Za-z0-9]{20}|C:\\Users|AppData' site/; then
            echo "Found something that must not be published."; exit 1
          fi

  deploy:
    environment:
      name: production
      url: https://narratedself.airiskpractice.org/
    runs-on: ubuntu-latest
    needs: build
    outputs:
      deployed: ${{ steps.publish.outputs.deployed }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed. Add both as secrets of the production environment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: steps.creds.outputs.ok == 'true'
      - name: Publish to Cloudflare Pages
        id: publish
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.163.0 pages deploy site --project-name=narratedself --branch=main --commit-dirty=true
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # Read-only checks of the live site once it's deployed: no guesses are sent and Plausible is blocked.
  live-check:
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Live site checks
        working-directory: e2e
        env:
          LIVE: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          sleep 30
          npx playwright test
