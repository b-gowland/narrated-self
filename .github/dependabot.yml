version: 2

# Weekly version updates, grouped to keep PR noise down, plus the workflow
# actions. Mirrors the other AI Risk Practice repos (ai-risk-kb,
# ai-risk-training, ai-risk-baseline).
updates:
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
