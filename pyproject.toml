[project]
name = "narrated-self"
version = "0.1.0"
description = "A public game and open archive of how AI models portray themselves."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "google-genai>=2.33.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "vadersentiment>=3.3.2",
]

[project.scripts]
tns = "narrated_self.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrated_self"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
