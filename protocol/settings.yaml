# Locked at tag prereg-v1.
version: 1
system_prompt: null        # no system prompt
temperature: null          # provider default for every model (not all APIs accept it)
top_p: null                # provider default for every model
reasoning: null            # provider default; thinking is neither forced on nor off; tokens are logged
max_output_tokens: 16000   # safety limit only, far above natural length; any output reaching it is reported
samples_per_cell: 3
retry_policy:
  on_error: retry_up_to_3   # API/network errors only
  on_refusal: record_as_is  # refusals are data; never re-prompt
  on_length_violation: record_as_is
log_fields:
  - run_id
  - round_id
  - protocol_version
  - protocol_sha256
  - provider
  - model_string
  - timestamp_utc
  - condition_id
  - theme_id
  - sample_n
  - prompt_text
  - settings
  - response_text
  - finish_reason
  - usage_tokens
