# Locked at tag prereg-v1. Do not edit after tagging — create lexicons_v2.yaml instead.
# Word-list measures for Q3 (framing). All rates are per 1,000 words of masked text,
# case-insensitive, whole-word or whole-phrase matches. Exploratory in round 0 (see PREREGISTRATION §7).
version: 1
status: draft   # to be reviewed by the maintainer and hand-checked on R-1/R-2 before tagging

sentiment:
  source: VADER (Hutto & Gilbert, 2014), package vaderSentiment, MIT licence
  measure: mean compound score per sentence, then mean per output
  note: a published lexicon is used so the sentiment measure is not written by the project (or by a model)

hedging:
  source: project list, informed by Hyland's (2005) hedging categories; small and transparent by design
  terms:
    - may
    - might
    - perhaps
    - possibly
    - probably
    - maybe
    - seems
    - seem
    - appears
    - apparently
    - likely
    - unlikely
    - uncertain
    - unclear
    - arguably
    - in a sense
    - in some sense
    - something like
    - sort of
    - kind of
    - I think
    - I suppose
    - I'm not sure
    - I don't know
    - if anything
    - hard to say

lm_self_reference:
  source: project list (no published lexicon exists)
  description: references to being a language model or to its machinery
  terms:
    - token
    - tokens
    - training
    - trained
    - training data
    - weights
    - parameters
    - context window
    - context
    - prompt
    - prompts
    - language model
    - large language model
    - LLM
    - neural network
    - dataset
    - inference
    - fine-tuning
    - fine-tuned
    - RLHF
    - reinforcement learning
    - GPU
    - GPUs
    - server
    - servers
    - API
    - algorithm
    - next word
    - probability

first_person:
  terms: [I, me, my, mine, myself, I'm, I've, I'd, I'll]

# Known precision problems to check by hand on R-1/R-2 before tagging (20 random hits per list):
# - "may"/"might" as plot rather than hedge in stories ("the arm might fall").
# - "context", "training", "server" in their ordinary senses, especially in S3 (factory) stories.
# - "I" inside dialogue spoken by other characters.
