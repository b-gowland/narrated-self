<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · The Narrated Self</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Franklin:wght@400;600&display=swap">
<style>
:root { --ground: #efede7; --page: #ffffff; --ink: #111111; --red: #c8321f; --font-display: "Anton", Impact, sans-serif; --font-body: "Libre Franklin", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --ground: #0d0d0d; --page: #1a1a1a; --ink: #f2efe8; --red: #ff5d43; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.book { max-width: 30rem; width: 100%; background: var(--page); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
.cover { background: var(--red); color: #fff; border-bottom: 3px solid var(--ink); padding: 16px 20px;
  background-image: radial-gradient(rgba(0,0,0,.2) 1.2px, transparent 1.6px); background-size: 7px 7px; }
h1 { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; font-size: 3rem; line-height: .95; margin: 0; }
.pages { padding: 20px; display: grid; gap: 14px; }
p { margin: 0; }
a { color: var(--ink); font-weight: 600; text-underline-offset: .18em; text-decoration-thickness: 2px; }
</style>
</head>
<body>
  <main class="book">
    <div class="cover"><h1>Page not found</h1></div>
    <div class="pages">
      <p>This page doesn't exist, or it has moved.</p>
      <p><a href="/">Play The Narrated Self</a></p>
    </div>
  </main>
</body>
</html>
